<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeLije pose demo</title>
    <!--
      Standalone test page for ai/pose. No app needed. It uses only the public
      API (ai/pose/index.js), exactly like the real frontend will.

      Recommended:  from the ai/ folder run  npm run demo
      Plain static server started at the repo root:
        open /ai/pose/demo/index.html?assets=/public
        (the import map below resolves the MediaPipe package for that case;
         Vite ignores it because it rewrites the import itself)

      URL options:
        ?debug=1       skeleton, standing-height line, live numbers and an event log
        ?duration=20   game length in seconds (default 60)
    -->
    <script type="importmap">
      {
        "imports": {
          "@mediapipe/tasks-vision": "/ai/node_modules/@mediapipe/tasks-vision/vision_bundle.mjs"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
        background: #14213d;
        color: #ffffff;
      }
      h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 10px 28px;
        border: 0;
        border-radius: 999px;
        background: #fca311;
        color: #14213d;
        cursor: pointer;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input[type="number"] {
        font: inherit;
        width: 4.5em;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid #44527a;
        background: #0b1326;
        color: inherit;
      }
      #status {
        min-height: 1.4em;
        text-align: center;
      }
      #status.error {
        color: #ffb4a2;
      }
      .stage {
        position: relative;
        width: min(100%, 640px);
      }
      canvas {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        border-radius: 16px;
        background: #0b1326;
      }
      /* Kept in the layout (not display:none) so mobile browsers keep decoding frames. */
      video {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }
      #debug {
        position: absolute;
        top: 8px;
        left: 8px;
        margin: 0;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.6);
        font: 12px/1.4 ui-monospace, Consolas, monospace;
        white-space: pre;
        pointer-events: none;
      }
      #result {
        width: min(100%, 640px);
        box-sizing: border-box;
        margin: 0;
        padding: 10px 14px;
        border-radius: 12px;
        background: #0b1326;
        font: 13px/1.5 ui-monospace, Consolas, monospace;
        white-space: pre-wrap;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>LeLije pose demo: Catch the Stars</h1>

    <div class="controls">
      <button id="startBtn" type="button">Start</button>
      <label>Seconds <input id="duration" type="number" min="10" max="300" step="5" value="60" /></label>
    </div>
    <div id="status" role="status">Press Start and allow the camera. Star = jump, cloud = both arms up.</div>

    <div class="stage">
      <video id="video" playsinline muted></video>
      <canvas id="canvas" width="640" height="480"></canvas>
      <pre id="debug" hidden></pre>
    </div>

    <pre id="result" hidden></pre>

    <script type="module">
      import { startCatchTheStars } from "../index.js";

      const params = new URLSearchParams(location.search);
      const debugOn = params.get("debug") === "1";
      // "" under Vite (public/ is served at "/"); "/public" under a plain static server.
      const assets = params.get("assets") ?? "";

      const videoEl = /** @type {HTMLVideoElement} */ (document.getElementById("video"));
      const canvasEl = /** @type {HTMLCanvasElement} */ (document.getElementById("canvas"));
      const startBtn = /** @type {HTMLButtonElement} */ (document.getElementById("startBtn"));
      const durationEl = /** @type {HTMLInputElement} */ (document.getElementById("duration"));
      const statusEl = /** @type {HTMLElement} */ (document.getElementById("status"));
      const debugEl = /** @type {HTMLElement} */ (document.getElementById("debug"));
      const resultEl = /** @type {HTMLElement} */ (document.getElementById("result"));

      const durationParam = Number(params.get("duration"));
      if (durationParam > 0) durationEl.value = String(durationParam);

      /** The game that is running now (null when idle). @type {{ stop: () => void } | null} */
      let game = null;
      /** The last game, kept so its end screen can be cleared before the next one starts. @type {{ stop: () => void } | null} */
      let previous = null;

      // Debug only: the last few events, shown in the overlay. Nothing is stored or sent.
      const MAX_LOG_LINES = 6;
      /** @type {string[]} */
      const eventLog = [];

      function setIdle() {
        game = null;
        startBtn.textContent = "Start";
        durationEl.disabled = false;
      }

      startBtn.addEventListener("click", async () => {
        if (game) {
          game.stop();
          setIdle();
          statusEl.classList.remove("error");
          statusEl.textContent = "Stopped. The camera is off.";
          debugEl.hidden = true;
          return;
        }

        if (previous) previous.stop();
        eventLog.length = 0;
        resultEl.hidden = true;
        debugEl.hidden = !debugOn;
        debugEl.textContent = "";
        statusEl.classList.remove("error");
        startBtn.textContent = "Stop";
        durationEl.disabled = true;

        let ended = false;
        const handle = await startCatchTheStars({
          videoEl,
          canvasEl,
          durationSec: Number(durationEl.value) || 60,
          modelPath: `${assets}/models/pose_landmarker_lite.task`,
          wasmPath: `${assets}/wasm`,
          debug: debugOn,
          onStatus(status) {
            statusEl.classList.toggle("error", status.state === "error");
            statusEl.textContent = status.errorCode ? `${status.hint} (${status.errorCode})` : status.hint;
            if (status.state === "error") {
              // The game already switched the camera off; just reset the button.
              ended = true;
              setIdle();
            }
          },
          onEvent: debugOn
            ? (event) => {
                const kind = event.kind ? ` ${event.kind}` : "";
                eventLog.push(`${(event.timeMs / 1000).toFixed(1).padStart(5)}s  ${event.type}${kind} ${event.value}`);
                if (eventLog.length > MAX_LOG_LINES) eventLog.shift();
              }
            : undefined,
          onDebug: debugOn
            ? (info) => {
                // "hip up": positive = hips ABOVE the standing height, in torso lengths (a jump needs +0.18).
                const offset = info.hipOffset;
                let text =
                  `fps      ${info.fps.toFixed(1)}` +
                  `\nstate    ${info.state}` +
                  `\nbaseline ${info.baselineHipY === null ? "-" : info.baselineHipY.toFixed(3)}` +
                  `\ntorso    ${info.torsoLength.toFixed(3)}` +
                  `\nhip up   ${offset >= 0.005 ? "+" : offset <= -0.005 ? "-" : " "}${Math.abs(offset).toFixed(2)} torso` +
                  `${info.jumping ? "  IN AIR" : ""}` +
                  `\narms     ${info.armsRaised ? `up ${info.armsHeldMs.toFixed(0)} ms` : "down"}`;
                if (eventLog.length > 0) text += `\n${eventLog.join("\n")}`;
                debugEl.textContent = text;
              }
            : undefined,
          onFinish(result) {
            // This object is what the frontend sends to the backend.
            resultEl.textContent = `onFinish payload:\n${JSON.stringify(result, null, 2)}`;
            resultEl.hidden = false;
            debugEl.hidden = true;
            ended = true;
            setIdle();
          },
        });
        previous = handle;
        // If it failed straight away, the button is already back to "Start".
        if (!ended) game = handle;
      });
    </script>
  </body>
</html>
